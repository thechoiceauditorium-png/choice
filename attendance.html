<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Attendance | The Choice Auditorium</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/supabase.min.js"></script>
</head>
<body>
  <div id="header-mount"></div>

  <main class="main-container">
    <div class="page-header">
      <div class="page-title">
        <h2>Staff Daily Attendance</h2>
        <span class="page-title-badge" id="attendance-role-badge">Worker Submission & Owner Approval</span>
      </div>
      <div id="owner-permission-notice" style="font-size: 0.82rem; color: var(--muted);">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Daily Marking & Approval Panel -->
    <div class="card" id="mark-attendance-card">
      <div class="card-header" style="flex-wrap: wrap; gap: 0.75rem;">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <h3 class="card-title">Daily Attendance & Approval</h3>
          <input type="date" id="att-selected-date" class="form-control" style="max-width: 170px;">
        </div>
        <div id="att-workflow-hint" style="font-size: 0.8rem; color: #666;">
          <!-- Role specific instructions injected via JS -->
        </div>
      </div>
      <div class="card-body">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.5rem;" id="workers-marking-container">
          <!-- Populated by JS for Gopinathan & Sajitha -->
        </div>
      </div>
    </div>

    <!-- Monthly Summary Section -->
    <div class="card">
      <div class="card-header">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <h3 class="card-title">Monthly Attendance Summary</h3>
          <input type="month" id="att-month-selector" class="form-control" style="max-width: 170px;">
        </div>
      </div>
      <div class="card-body">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem;" id="monthly-stats-container">
          <!-- Summary cards for Gopinathan & Sajitha -->
        </div>

        <h4 style="font-size: 0.95rem; margin-bottom: 0.75rem;">Daily Log & Approval History</h4>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Staff Member</th>
                <th>Designation</th>
                <th>Status</th>
                <th>Notes / Reason</th>
                <th>Marked By</th>
                <th>Approval Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="attendance-history-tbody">
              <!-- Injected via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal: Admin Edit Attendance Record -->
  <div class="modal-backdrop" id="edit-attendance-modal">
    <div class="modal-card" style="max-width: 480px;">
      <div class="modal-header">
        <h3>Admin Attendance Override / Edit</h3>
        <button class="btn-icon" id="close-edit-att-modal-btn">X</button>
      </div>
      <div class="modal-body">
        <form id="edit-attendance-form">
          <input type="hidden" id="edit-att-id">
          <input type="hidden" id="edit-att-worker-id">

          <div class="form-group">
            <label class="form-label">Staff Member</label>
            <input type="text" id="edit-att-worker-name" class="form-control" readonly style="background: #F5F5F5; font-weight: 600;">
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-att-date">Attendance Date *</label>
            <input type="date" id="edit-att-date" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label">Attendance Status *</label>
            <div style="display: flex; gap: 1rem; margin-top: 0.25rem;">
              <label style="display: flex; align-items: center; gap: 0.35rem; font-size: 0.88rem; cursor: pointer;">
                <input type="radio" name="edit_att_status" value="present" checked> Present
              </label>
              <label style="display: flex; align-items: center; gap: 0.35rem; font-size: 0.88rem; cursor: pointer;">
                <input type="radio" name="edit_att_status" value="half-day"> Half-Day
              </label>
              <label style="display: flex; align-items: center; gap: 0.35rem; font-size: 0.88rem; cursor: pointer;">
                <input type="radio" name="edit_att_status" value="absent"> Absent
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-att-note">Admin Notes / Remarks</label>
            <textarea id="edit-att-note" class="form-control" rows="2" placeholder="Reason for edit or override..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-att-approval">Approval Decision *</label>
            <select id="edit-att-approval" class="form-control" required>
              <option value="Approved">Approved (Verified by Admin)</option>
              <option value="Pending Approval">Pending Approval</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancel-edit-att-modal-btn">Cancel</button>
        <button type="button" class="btn btn-primary" id="save-edit-att-btn">Save Changes</button>
      </div>
    </div>
  </div>

  <div id="toast-mount"></div>

  <script type="module" src="js/attendance.js?v=2"></script>
</body>
</html>
